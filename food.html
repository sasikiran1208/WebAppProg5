<!doctype html>
<html lang="en">
  <head>
    <title>Dinner Time</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <h1>Dinner time by Sasi Kiran Kodali</h1>

    <div class="container">
      <div class="row">
        <div class="col-sm-2">K</div>
        <div class="col-sm-2">O</div>
        <div class="col-sm-2">D</div>
        <div class="col-sm-2">A</div>
        <div class="col-sm-2">L</div>
        <div class="col-sm-2">I</div>
      </div>

      <div class="row">
        <div class="col-md">Kebab</div>
        <div class="col-md">Omelette</div>
        <div class="col-md">Dosa</div>
        <div class="col-md">Apple</div>
        <div class="col-md">Lasagna</div>
        <div class="col-md">Idli</div>
      </div>

      <p>
        The food row breaks first because it uses col-md, while the letters use
        col-sm-2. The md breakpoint is larger than the sm breakpoint.
      </p>
    </div>
  </body>
</html>
